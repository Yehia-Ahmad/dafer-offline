<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Nota users and permissions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0E4D45}a:hover{color:#142321}
.num{font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:1px solid #E6E2D9;border-radius:16px}
.btn{font-family:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CFCAC0;background:#FFFFFF;color:#142321;cursor:pointer}
.btn-p{background:#0E4D45;border-color:#0E4D45;color:#FFFFFF;font-weight:700}
.in{font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid #CFCAC0;border-radius:10px;background:#FFFFFF;color:#142321;width:100%}
.lb{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3B4A47}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
</style>
</helmet>
<div style="display: flex; flex-direction: row; flex-wrap: wrap; min-height: 100vh; background: #F5F3EE; color: #142321; font-family: 'Alexandria', system-ui, sans-serif">
  <dc-import name="Sidebar" active="users" hint-size="248px,960px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800">المستخدمين والصلاحيات</h1>
      <button type="button" class="btn btn-p">+ مستخدم جديد</button>
    </div>
    <div style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section class="card" aria-label="المستخدمين" style="flex: 1 1 300px; max-width: 380px; padding: 10px; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{users}}" as="u" hint-placeholder-count="5">
          <a href="#" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; text-decoration: none; color: #142321; background: {{u.bg}}; opacity: {{u.op}}">
            <span style="width: 40px; height: 40px; border-radius: 999px; background: {{u.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">{{u.i}}</span>
            <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 700">{{u.name}}</span>
              <span style="font-size: 12px; color: #4A5856">{{u.meta}}</span>
            </span>
            <span class="pill" style="color: {{u.rc}}; background: {{u.rb}}">{{u.role}}</span>
          </a>
        </sc-for>
      </section>

      <section class="card" style="flex: 999 1 520px; min-width: 0; padding: 22px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 14px">
          <span style="width: 56px; height: 56px; border-radius: 999px; background: #1F6F8B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">م</span>
          <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px">
            <h2 style="margin: 0; font-size: 22px; font-weight: 800">محمود سعيد</h2>
            <span class="num" style="font-size: 13px; color: #4A5856">mahmoud · آخر دخول النهارده ٩:٠٢ ص من جهاز الكاشير ١</span>
          </div>
          <button type="button" class="btn">تغيير كلمة السر</button>
          <button type="button" class="btn" style="color: #9A3412">إيقاف الحساب</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
          <label class="lb">الاسم<input type="text" class="in" value="محمود سعيد"></label>
          <label class="lb">اسم المستخدم<input type="text" class="in" value="mahmoud" style="direction: ltr; text-align: right"></label>
          <label class="lb">الدور (قالب جاهز)
            <select class="in"><option>كاشير</option><option>مدير</option><option>أمين مخزن</option><option>محاسب</option></select>
          </label>
          <label class="lb">أقصى خصم مسموح<input type="text" class="in num" value="٥٪"></label>
        </div>
        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px">
          <h3 style="margin: 0; font-size: 17px; font-weight: 700">الصلاحيات</h3>
          <span style="font-size: 13px; color: #4A5856">اختار الدور يملا الصلاحيات، وبعدين تقدر تعدّل عليها</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
            <fieldset style="margin: 0; border: 1px solid #E6E2D9; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
              <legend style="font-size: 14px; font-weight: 700; padding: 0 6px">{{g.name}}</legend>
              <sc-for list="{{g.items}}" as="p" hint-placeholder-count="4">
                <label style="display: flex; flex-direction: row; align-items: center; gap: 10px; font-size: 14px; min-height: 36px; color: {{p.fg}}">
                  <input type="checkbox" checked="{{p.on}}" style="width: 18px; height: 18px; accent-color: #0E4D45">
                  {{p.label}}
                </label>
              </sc-for>
            </fieldset>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: row; justify-content: flex-end; gap: 10px">
          <button type="button" class="btn">إلغاء</button>
          <button type="button" class="btn btn-p">حفظ التغييرات</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const R = {
      owner: { role: 'المالك', rc: '#FFFFFF', rb: '#0E4D45' },
      manager: { role: 'مدير', rc: '#1F4E79', rb: '#E3EDF7' },
      cashier: { role: 'كاشير', rc: '#0E4D45', rb: '#E6EFEC' },
      store: { role: 'أمين مخزن', rc: '#7A5B00', rb: '#FBF1D6' },
      acct: { role: 'محاسب', rc: '#5B2A86', rb: '#EFE6F7' }
    };
    const u = (name, meta, r, av, sel, off) => ({ name, meta, i: name[0], av, ...R[r], bg: sel ? '#F1F7F5' : 'transparent', op: off ? 0.55 : 1 });
    const users = [
      u('أحمد', 'ahmed · الجهاز الرئيسي', 'owner', '#E4572E', false, false),
      u('محمود سعيد', 'mahmoud · نشط', 'cashier', '#1F6F8B', true, false),
      u('سارة عادل', 'sara · نشط', 'acct', '#5B2A86', false, false),
      u('عم رضا', 'reda · نشط', 'store', '#7A5B00', false, false),
      u('كريم', 'karim · موقوف', 'cashier', '#6B7775', false, true)
    ];
    const g = (name, items) => ({ name, items: items.map(([label, on]) => ({ label, on, fg: on ? '#142321' : '#4A5856' })) });
    const groups = [
      g('البيع', [['بيع كاش', true], ['بيع آجل', true], ['تعديل فاتورة', false], ['إلغاء فاتورة', false], ['مرتجع', true]]),
      g('الأصناف', [['عرض الأصناف', true], ['إضافة وتعديل', false], ['تعديل الأسعار', false], ['رؤية سعر الشراء والربح', false]]),
      g('العملاء والموردين', [['عرض العملاء', true], ['تحصيل دفعات', true], ['الموردين والمشتريات', false]]),
      g('الخزنة', [['إقفال ورديته', true], ['تسجيل مصروف', false], ['تحويل بين الخزائن', false], ['رؤية رصيد كل الخزائن', false]]),
      g('التقارير والحسابات', [['تقرير الأرباح', false], ['كشوف الحساب', false], ['القيود والتقارير المالية', false], ['إقفال الفترات', false]]),
      g('الإدارة', [['المستخدمين', false], ['بيانات المحل', false], ['النسخ الاحتياطي', false]])
    ];
    return { users, groups };
  }
}
</script>
</body>
</html>
