<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Nota products and categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0E4D45}a:hover{color:#142321}
.num{font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:1px solid #E6E2D9;border-radius:16px}
.btn{font-family:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CFCAC0;background:#FFFFFF;color:#142321;cursor:pointer}
.btn-p{background:#0E4D45;border-color:#0E4D45;color:#FFFFFF;font-weight:700}
.in{font-family:inherit;font-size:15px;padding:11px 12px;border:1px solid #CFCAC0;border-radius:10px;background:#FFFFFF;color:#142321;width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;font-size:13px;font-weight:700;color:#4A5856;background:#FAF9F6;padding:12px 16px}
.tbl td{padding:12px 16px;border-top:1px solid #F0EDE6}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
</style>
</helmet>
<div style="display: flex; flex-direction: row; flex-wrap: wrap; min-height: 100vh; background: #F5F3EE; color: #142321; font-family: 'Alexandria', system-ui, sans-serif">
  <dc-import name="Sidebar" active="products" hint-size="248px,960px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800">الأصناف والفئات</h1>
      <div style="display: flex; flex-direction: row; gap: 10px; flex-wrap: wrap">
        <button type="button" class="btn">استيراد من Excel</button>
        <button type="button" class="btn">تصدير</button>
        <button type="button" class="btn btn-p">+ صنف جديد</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <nav aria-label="الفئات" class="card" style="flex: 1 1 220px; max-width: 280px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 6px 8px 10px 8px">
          <span style="font-size: 15px; font-weight: 700">الفئات</span>
          <button type="button" aria-label="فئة جديدة" class="btn" style="min-height: 36px; width: 36px; padding: 0">+</button>
        </div>
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <a href="#" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-size: 14px; color: {{c.fg}}; background: {{c.bg}}; font-weight: {{c.w}}">
            <span>{{c.name}}</span><span class="num" style="font-size: 12px; color: #4A5856">{{c.n}}</span>
          </a>
        </sc-for>
      </nav>
      <section class="card" style="flex: 999 1 520px; min-width: 0; overflow: hidden">
        <div style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; padding: 14px 16px; align-items: center">
          <input type="text" class="in" placeholder="بحث بالاسم أو الكود" style="flex: 1 1 240px; width: auto">
          <label style="display: flex; flex-direction: row; align-items: center; gap: 8px; font-size: 14px; min-height: 44px">
            <input type="checkbox" style="width: 18px; height: 18px; accent-color: #0E4D45"> اللي قرب يخلص بس
          </label>
        </div>
        <div style="overflow-x: auto">
          <table class="tbl" style="min-width: 820px">
            <thead><tr><th>الكود</th><th>الصنف</th><th>المخزون</th><th>سعر الشراء</th><th>قطاعي</th><th>جملة</th><th>خصم</th><th></th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                <tr>
                  <td class="num" style="color: #4A5856; direction: ltr; text-align: right">{{r.code}}</td>
                  <td style="font-weight: 500">{{r.name}}</td>
                  <td><span class="pill num" style="color: {{r.sc}}; background: {{r.sb}}">{{r.stock}}</span></td>
                  <td class="num" style="color: #4A5856">{{r.cost}}</td>
                  <td class="num" style="font-weight: 700">{{r.retail}}</td>
                  <td class="num">{{r.whole}}</td>
                  <td class="num" style="color: #4A5856">{{r.disc}}</td>
                  <td><button type="button" class="btn" style="min-height: 36px; padding: 0 12px; font-size: 13px">تعديل</button></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <div style="display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #F0EDE6; font-size: 13px; color: #4A5856">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"></path></svg>
          عمود سعر الشراء بيظهر بس للي عنده صلاحية "رؤية التكلفة". الكاشير مش بيشوفه.
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const names = [['كل الأصناف', '٨٤'], ['لمبات', '٢٢'], ['شواحن', '١٤'], ['أسلاك', '٩'], ['مفاتيح وبرايز', '١٨'], ['كشافات وبانلات', '١٢'], ['مشتركات', '٩']];
    const cats = names.map(([name, n], i) => ({ name, n, bg: i === 1 ? '#E6EFEC' : 'transparent', fg: i === 1 ? '#0E4D45' : '#142321', w: i === 1 ? 700 : 400 }));
    const r = (code, name, stock, cost, retail, whole, disc) => {
      const s = Number(stock);
      const level = s <= 3 ? ['#9A3412', '#FBE9E3'] : s <= 8 ? ['#7A5B00', '#FBF1D6'] : ['#0E4D45', '#E6EFEC'];
      return { code, name, stock: s.toLocaleString('ar-EG'), sc: level[0], sb: level[1], cost, retail, whole, disc };
    };
    const rows = [
      r('LED-9', 'لمبة LED ٩ وات', '36', '٢٢', '٣٥', '٣٠', '—'),
      r('LED-12', 'لمبة LED ١٢ وات', '2', '٢٨', '٤٥', '٤٠', '—'),
      r('LED-18', 'لمبة LED ١٨ وات', '24', '٣٨', '٦٠', '٥٢', '٥٪'),
      r('LED-30', 'لمبة LED ٣٠ وات', '11', '٦٥', '٩٥', '٨٥', '—'),
      r('SP-5W', 'سبوت ليد ٥ وات', '7', '٣٠', '٥٠', '٤٤', '—'),
      r('FL-50', 'كشاف خارجي ٥٠ وات', '9', '١٧٠', '٢٤٠', '٢١٥', '١٠٪'),
      r('ST-5M', 'شريط ليد ٥ متر', '5', '٩٠', '١٤٠', '١٢٥', '—'),
      r('BLB-FIL', 'لمبة فتلة ديكور', '14', '٤٠', '٦٥', '٥٨', '—')
    ];
    return { cats, rows };
  }
}
</script>
</body>
</html>
