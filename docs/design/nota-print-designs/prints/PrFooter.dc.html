<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Print footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 714px; box-sizing: border-box; font-family: 'Alexandria', system-ui, sans-serif; color: #4A5856; display: flex; flex-direction: column; gap: 6px; direction: rtl; border-top: 1px solid #9A9A9A; padding-top: 10px">
  <sc-if value="{{note}}" hint-placeholder-val="{{ true }}">
    <span style="font-size: 12px; color: #142321; text-align: center">{{note}}</span>
  </sc-if>
  <div style="display: flex; flex-direction: row; justify-content: space-between; font-size: 12px">
    <span>طُبع بواسطة {{user}} · {{printed}}</span>
    <span>تم إنشاء هذا المستند إلكترونيًا بواسطة نوتة</span>
    <span>صفحة {{page}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"note":{"editor":"text","default":"البضاعة المباعة لا ترد ولا تستبدل بعد ١٤ يوم"},"user":{"editor":"text","default":"محمود"},"printed":{"editor":"text","default":"٥ / ١١ / ٢٠٢٦ ١٢:٤٠ م"},"page":{"editor":"text","default":"١ من ١"},"$preview":{"width":714,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      note: this.props.note ?? 'البضاعة المباعة لا ترد ولا تستبدل بعد ١٤ يوم',
      user: this.props.user ?? 'محمود',
      printed: this.props.printed ?? '٥ / ١١ / ٢٠٢٦ ١٢:٤٠ م',
      page: this.props.page ?? '١ من ١'
    };
  }
}
</script>
</body>
</html>
