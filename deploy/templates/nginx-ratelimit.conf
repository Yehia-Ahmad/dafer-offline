# Installed as /etc/nginx/conf.d/nota-ratelimit.conf (http context).
# Only POST /api/auth/login is rate limited, 10 requests per minute per client IP (the burst is set in the site).
# An empty key means "not limited", so other methods on the same path and every other URL are untouched.
map $request_method $nota_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $nota_login_key zone=nota_login:10m rate=10r/m;

# Online Stage 3 (customer website): the same pattern, POST only, 10 requests per minute per client IP, separate zones so
# placing orders and signing in never share a budget. The burst is set in the site.
limit_req_zone $nota_login_key zone=nota_store_order:10m rate=10r/m;
limit_req_zone $nota_login_key zone=nota_store_auth:10m rate=10r/m;
