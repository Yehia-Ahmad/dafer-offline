# Installed as /etc/nginx/conf.d/nota-ratelimit.conf (http context).
# Only POST /api/auth/login is rate limited, 10 requests per minute per client IP (the burst is set in the site).
# An empty key means "not limited", so other methods on the same path and every other URL are untouched.
map $request_method $nota_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $nota_login_key zone=nota_login:10m rate=10r/m;

# Online Stage 3 (customer website): the same pattern, POST only, 10 requests per minute per client IP, separate zones so
# placing orders and signing in never share a budget. The burst is set in the site.
limit_req_zone $nota_login_key zone=nota_store_order:10m rate=10r/m;
limit_req_zone $nota_login_key zone=nota_store_auth:10m rate=10r/m;

# Online Stage 5B: the checkout asks the server to price the cart on every change (lines, zone, payment), so the quote gets its
# own, looser zone (60 requests per minute per client IP) and never uses up the order zone above.
limit_req_zone $nota_login_key zone=nota_store_quote:10m rate=60r/m;

# Online Stage 7A (campaigns): anonymous visit counting (POST /api/store/visits, POST-only key like the zones above) and the short
# tracking link /go/<code> (a GET, so it is keyed on the client address directly). These are only a flood guard: mobile carriers put
# thousands of real customers behind ONE address (CGNAT), so a successful ad must never meet a 429. 3000 per minute per client IP with a
# large burst (set in the site). The real per-IP cap on COUNTED clicks lives in the storefront (/go always redirects, see server.ts).
limit_req_zone $nota_login_key zone=nota_store_visits:10m rate=3000r/m;
limit_req_zone $binary_remote_addr zone=nota_go:10m rate=3000r/m;

# Online Stage 5B: the access log never holds a customer tracking token (the URL is the secret that shows an order) nor a Referer.
map $request_uri $nota_log_uri {
    ~^(?<head>/order/)[^?\s]+(?<tail>\?.*)?$                       "${head}***${tail}";
    ~^(?<head>/api/store/orders/track/)[^?\s]+(?<tail>\?.*)?$      "${head}***${tail}";
    default                                                        $request_uri;
}
log_format nota_masked '$remote_addr - [$time_local] "$request_method $nota_log_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
