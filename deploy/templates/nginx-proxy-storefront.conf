# Installed as /etc/nginx/snippets/nota-proxy-storefront.conf: proxy settings for the storefront (the server-side rendered customer website).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# $remote_addr (not $proxy_add_x_forwarded_for): a client-supplied X-Forwarded-For must never reach the storefront.
# The storefront trusts X-Forwarded-For / -Proto only (no X-Forwarded-Host), so these two are all it needs.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 15s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
