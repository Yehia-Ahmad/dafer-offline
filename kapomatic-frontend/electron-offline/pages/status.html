<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Kapomatic Offline</title>
  <link rel="stylesheet" href="status.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <h1>Kapomatic Offline</h1>
    <div class="state">
      <span id="spinner" class="spinner" hidden></span>
      <p id="label">جاري التحميل...</p>
    </div>
    <section id="error" class="error" hidden>
      <p id="error-message"></p>
      <pre id="error-detail" hidden></pre>
      <p class="code">رمز الخطأ: <span id="error-code"></span></p>
    </section>
    <div class="actions">
      <button id="retry" type="button" hidden>إعادة المحاولة</button>
      <button id="change-address" type="button" class="secondary" hidden>تغيير عنوان الجهاز الرئيسي</button>
      <button id="logs" type="button" class="secondary">فتح مجلد السجلات</button>
      <button id="quit" type="button" class="secondary">خروج</button>
    </div>
    <footer>الإصدار <span id="version"></span></footer>
  </main>
  <script src="status.js"></script>
</body>
</html>
