<!-- Stage 15: lock screen (overlay; the page under it stays as it was). Layout follows Login.dc.html. -->
@if (visible()) {
  <div class="nota-lock" role="dialog" aria-modal="true" aria-labelledby="notaLockTitle" data-test="lock-overlay">
    <form class="nota-lock__card" (ngSubmit)="unlock()" novalidate>
      <div class="nota-lock__brand">
        @if (logoSrc()) {
          <img class="nota-lock__logo" [src]="logoSrc()" [alt]="shopName()" />
        } @else {
          <svg class="nota-lock__logo" width="64" height="64" viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" rx="24" class="nota-lock__mark-tile"></rect>
            <path d="M25 42 C25 80 75 80 75 42" fill="none" class="nota-lock__mark-noon" stroke-width="12" stroke-linecap="round"></path>
            <circle cx="50" cy="25" r="8.5" class="nota-lock__mark-coin"></circle>
          </svg>
        }
        @if (shopName()) {
          <span class="nota-lock__shop">{{ shopName() }}</span>
        }
      </div>

      <div class="nota-lock__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </div>
      <h2 id="notaLockTitle" class="nota-lock__title">{{ 'session.lock.title' | translate }}</h2>
      <p class="nota-lock__user" data-test="lock-user">{{ userName() }}</p>
      <p class="nota-lock__lead">{{ 'session.lock.lead' | translate }}</p>

      <label class="nota-label" for="notaLockPassword">{{ 'auth.fields.password' | translate }}</label>
      <div class="nota-lock__pass">
        <input #passwordInput id="notaLockPassword" name="password" class="nota-input nota-lock__input"
          [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password" [disabled]="busy()"
          [ngModel]="password()" (ngModelChange)="password.set($event)" [attr.aria-invalid]="error() ? 'true' : null"
          aria-describedby="notaLockError" />
        <button type="button" class="nota-lock__eye" (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="(showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | translate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <p id="notaLockError" class="nota-lock__error" role="alert" data-test="lock-error">{{ error() }}</p>

      <button type="submit" notaButton="primary" class="nota-lock__submit" [disabled]="busy()" data-test="lock-unlock">
        {{ (busy() ? 'session.lock.checking' : 'session.lock.unlock') | translate }}
      </button>
      <button type="button" notaButton class="nota-lock__switch" [disabled]="busy()" (click)="switchUser()" data-test="lock-switch">
        {{ 'session.lock.switchUser' | translate }}
      </button>
    </form>
  </div>
}
