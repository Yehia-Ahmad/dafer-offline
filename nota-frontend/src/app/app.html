<!-- Stage 9: the app frame (sidebar + top bar + page container) is rendered once here. Routes with data.frame === false (e.g. /ui-kit) render without it. -->
@if (framed()) {
  <app-side-nav>
    <router-outlet />
  </app-side-nav>
} @else {
  <router-outlet />
}
<!-- Stage 14: permission and session messages. -->
<nota-toasts />
@if (offline) {
  <app-connection-overlay />
  <app-version-notice />
}
