<!-- Stage 9: the app frame (sidebar + top bar + page container) is rendered once here. Routes with data.frame === false (e.g. /ui-kit) render without it. -->
@if (framed()) {
  <!-- Online Stage 6A: below 768 px the phone shell; at 768 px and above the unchanged desktop frame. -->
  @if (layout.isMobile()) {
    <nota-mobile-shell>
      <router-outlet />
    </nota-mobile-shell>
  } @else {
    <app-side-nav>
      <router-outlet />
    </app-side-nav>
  }
} @else {
  <router-outlet />
}
<!-- Stage 14: permission and session messages. -->
<nota-toasts />
<!-- Stage 15: the lock screen (an overlay: the page under it keeps its state) and the unsaved-work question. -->
<nota-lock-overlay />
<nota-unsaved-work-dialog />
<!-- Decision D: the name of this device, asked once after the first sign in. -->
<nota-device-name-dialog />
