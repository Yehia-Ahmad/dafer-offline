<section class="accounting-page"><header class="page-head"><div><p class="eyebrow">{{ 'accounting.section' | translate }}</p><h1>{{ 'accounting.accounts.title' | translate }}</h1></div><label>{{ 'accounting.asOf' | translate }}<input type="date" [(ngModel)]="asOf" (change)="load()"></label></header>
<div class="state" *ngIf="loading" role="status">{{ 'common.loading' | translate }}</div><div class="state error" *ngIf="error" role="alert">{{ error }}</div>
<div class="card tree" *ngIf="!loading && !error"><div class="tree-head"><span>{{ 'accounting.account' | translate }}</span><span>{{ 'accounting.balance' | translate }}</span></div><button class="tree-row" type="button" *ngFor="let row of rows" (click)="activate(row)" [style.--level]="row.level" [class.group]="row.isGroup" [class.party]="row.customer"><span class="account-name"><span class="chevron" [class.open]="expanded.has(row._id)" *ngIf="row.isGroup || row.systemKey === 'CUSTOMERS'">›</span><span class="code" dir="ltr">{{ row.code }}</span><span>{{ name(row) }}</span></span><span class="balance" *ngIf="row | notaBalance as shown"><strong class="money" [class.warn]="shown.warning" [attr.data-side]="shown.side" data-test="balance">{{ shown.text }} {{ 'accounting.side.' + shown.side | translate }}</strong><small class="hint" *ngIf="shown.warning" data-test="opposite-hint">{{ 'accounting.oppositeHint' | translate }}</small></span></button></div></section>
